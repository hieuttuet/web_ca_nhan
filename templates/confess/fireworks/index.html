    let currentThemeIndex = 0;

    // Helper hòa trộn màu với màu trắng để tạo tâm phát sáng (Luminous Highlight Core)
    function blendWithWhite(hex, ratio) {
      let c = hex.replace('#', '');
      if (c.length === 3) c = c[0] + c[0] + c[1] + c[1] + c[2] + c[2];
      const r = parseInt(c.substring(0, 2), 16);
      const g = parseInt(c.substring(2, 4), 16);
      const b = parseInt(c.substring(4, 6), 16);
      const nr = Math.min(255, Math.round(r + (255 - r) * ratio));
      const ng = Math.min(255, Math.round(g + (255 - g) * ratio));
      const nb = Math.min(255, Math.round(b + (255 - b) * ratio));
      return `rgb(${nr}, ${ng}, ${nb})`;
    }

    // Bộ nhớ cache Sprite lõi chữ sắc nét
    const coreSpriteCache = {};

    function getCoreSprite(color) {
      if (coreSpriteCache[color]) return coreSpriteCache[color];
      const size = 8;
      const c = document.createElement('canvas');
      c.width = size;
      c.height = size;
      const sctx = c.getContext('2d');
      const center = size / 2;
      const radius = 1.6;

      // Hạt tròn sắc sảo: tâm sáng dịu vừa phải (52% pastel tint), viền giữ màu bão hòa chuẩn, KHÔNG lóa trắng
      const grad = sctx.createRadialGradient(center, center, 0, center, center, radius);
      grad.addColorStop(0, blendWithWhite(color, 0.52));
      grad.addColorStop(0.65, color);
      grad.addColorStop(0.95, color);
      grad.addColorStop(1.0, 'rgba(0,0,0,0)');

      sctx.fillStyle = grad;
      sctx.fillRect(0, 0, size, size);

      coreSpriteCache[color] = c;
      return c;
    }

    /**
     * ============================================================================
     * 2. KỊCH BẢN 5 HỒI PHÁO HOA TỎ TÌNH LÃNG MẠN (MULTI-ROCKET SALVOS)

     */

      {

      {

        badge: '✨ Hồi 3/5: Chân Tình',

    let currentStage = 1;
    let activeRockets = [];
    let currentExplosionPoints = [];

    /**
     * ============================================================================
     * 3. SOUND SYNTHESIZER & AUDIO CONTROLLER (Web Audio API + Background MP3)
     * ============================================================================
     */
    class SoundController {
      constructor(audioElement) {
        this.ctx = null;
        this.bgAudio = audioElement;
        this.muted = false;
        this.fadeInterval = null;
        this.noiseBuffer = null;
      }

      initContext() {
        if (!this.ctx) {
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          if (AudioCtx) {
            this.ctx = new AudioCtx();
            const bufferSize = Math.floor(this.ctx.sampleRate * 1.5);
            this.noiseBuffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
            const output = this.noiseBuffer.getChannelData(0);
            for (let i = 0; i < bufferSize; i++) {
              output[i] = Math.random() * 2 - 1;
            }
          }
        }
        if (this.ctx && this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
      }

      playLaunchWhistle(duration = 0.95) {
        if (this.muted) return;
        this.initContext();
        if (!this.ctx) return;

        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();

        osc.type = 'sine';
        osc.frequency.setValueAtTime(220, now);
        osc.frequency.exponentialRampToValueAtTime(920, now + duration);

        gain.gain.setValueAtTime(0.01, now);
        gain.gain.linearRampToValueAtTime(0.09, now + duration * 0.3);
        gain.gain.exponentialRampToValueAtTime(0.001, now + duration);

        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + duration);
      }

      playExplosionBoom(isMain = true) {
        if (this.muted) return;
        this.initContext();
        if (!this.ctx || !this.noiseBuffer) return;

        const now = this.ctx.currentTime;
        const duration = isMain ? 1.5 : 0.75;

        if (isMain) {
          const subOsc = this.ctx.createOscillator();
          const subGain = this.ctx.createGain();
          subOsc.type = 'triangle';
          subOsc.frequency.setValueAtTime(130, now);
          subOsc.frequency.exponentialRampToValueAtTime(28, now + 0.55);

          subGain.gain.setValueAtTime(0.55, now);
          subGain.gain.exponentialRampToValueAtTime(0.001, now + 0.6);

          subOsc.connect(subGain);
          subGain.connect(this.ctx.destination);
          subOsc.start(now);
          subOsc.stop(now + 0.62);
        }

        const whiteNoise = this.ctx.createBufferSource();
        whiteNoise.buffer = this.noiseBuffer;

        const filter = this.ctx.createBiquadFilter();
        filter.type = 'lowpass';
        filter.frequency.setValueAtTime(isMain ? 780 : 950, now);
        filter.frequency.exponentialRampToValueAtTime(95, now + duration);

        const noiseGain = this.ctx.createGain();
        noiseGain.gain.setValueAtTime(isMain ? 0.48 : 0.28, now);
        noiseGain.gain.exponentialRampToValueAtTime(0.001, now + duration);

        whiteNoise.connect(filter);
        filter.connect(noiseGain);
        noiseGain.connect(this.ctx.destination);
        whiteNoise.start(now);
        whiteNoise.stop(now + duration);
      }

      startBackgroundMusicWithFadeIn() {
        if (!this.bgAudio || this.muted) return;
        if (this.fadeInterval) clearInterval(this.fadeInterval);

        this.bgAudio.volume = 0.02;
        this.bgAudio.currentTime = 0;
        const playPromise = this.bgAudio.play();
        if (playPromise !== undefined) {
          playPromise.catch(() => {});
        }

        let vol = 0.02;
        const targetVolume = 0.75;
        this.fadeInterval = setInterval(() => {
          if (this.muted) {
            clearInterval(this.fadeInterval);
            return;
          }
          vol = Math.min(targetVolume, vol + 0.04);
          this.bgAudio.volume = vol;
          if (vol >= targetVolume) {
            clearInterval(this.fadeInterval);
          }
        }, 140);
      }

      toggleMute() {
        this.muted = !this.muted;
        if (this.bgAudio) {
          this.bgAudio.muted = this.muted;
        }
        return this.muted;
      }
    }

    /**
     * ============================================================================
     * 4. CLASS FIREWORK (Tên lửa vút lên)
     * ============================================================================
     */
    class Firework {
      constructor(startX, startY, targetX, targetY, isMain = true) {
        this.x = startX;
        this.y = startY;
        this.targetX = targetX;
        this.targetY = targetY;
        this.isMain = isMain;

        const distY = startY - targetY;
        this.vy = -Math.sqrt(2 * 0.78 * distY) - 1.2;
        this.gravity = 0.78;
        this.trail = [];
        this.exploded = false;
        this.burstCreated = false;
      }

      update() {
        this.trail.push({ x: this.x, y: this.y, alpha: 1.0 });
        if (this.trail.length > 22) {
          this.trail.shift();
        }
        for (let i = 0; i < this.trail.length; i++) {
          this.trail[i].alpha *= 0.88;
        }

        this.vy += this.gravity;
        if (this.vy > -4) this.vy = -4;

        this.x += (this.targetX - this.x) * 0.088;
        this.y += this.vy;

        const dy = this.targetY - this.y;
        if (this.y <= this.targetY || Math.abs(dy) <= 12) {
          this.y = this.targetY;
          this.exploded = true;
        }
      }

      draw(ctx) {
        ctx.fillStyle = 'rgba(253, 224, 71, 0.85)';
        for (let i = 0; i < this.trail.length; i++) {
          const pt = this.trail[i];
          const ratio = (i + 1) / this.trail.length;
          ctx.globalAlpha = pt.alpha * ratio * 0.85;
          ctx.beginPath();
          ctx.arc(pt.x + (Math.random() - 0.5) * 1.5, pt.y, ratio * 3.8, 0, Math.PI * 2);
          ctx.fill();
        }

        ctx.globalAlpha = 0.35;
        ctx.fillStyle = '#fde047';
        ctx.beginPath();
        ctx.arc(this.x, this.y, 9, 0, Math.PI * 2);
        ctx.fill();

        ctx.globalAlpha = 0.75;
        ctx.beginPath();
        ctx.arc(this.x, this.y, 5.5, 0, Math.PI * 2);
        ctx.fill();

        ctx.globalAlpha = 1.0;
        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.arc(this.x, this.y, 3.2, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    /**
     * ============================================================================
     * 5. CLASS BURST SPARK (Cấu trúc 5 tầng hoa 3D, độ rơi liễu rủ kiêu sa)
     * ============================================================================
     */
    class BurstSpark {
      constructor(originX, originY, color, isBig = false) {
        this.x = originX;
        this.y = originY;
        this.prevX = originX;
        this.prevY = originY;

        const angle = Math.random() * Math.PI * 2;
        // Chuẩn hóa tỷ lệ theo khung hình, không để vươn tràn mép màn hình
        const baseScale = Math.max(0.82, Math.min(width, height) / 660);

        // CẤU TRÚC PHÁO HOA 5 TẦNG RÕ NÉT:
        // Tầng 1 (15%): Tâm nhụy kim sa - sáng tụ ở lõi
        // Tầng 2 (20%): Vòng nhụy ngọc - đệm trung tâm
        // Tầng 3 (35%): Thân hoa chính - quả cầu pháo hoa rực rỡ
        // Tầng 4 (20%): Vành hoa bung xòe - định hình cánh hoa
        // Tầng 5 (10%): Tia sao chổi vươn xa - điểm nhấn kiêu sa (đã giảm nhẹ tầm cực đại)
        const tier = Math.random();
        let speedMult;
        if (tier < 0.15) {
          speedMult = Math.random() * 3.5 + 4.5;  // Tầng 1: 4.5 - 8.0
        } else if (tier < 0.35) {
          speedMult = Math.random() * 4.0 + 8.5;  // Tầng 2: 8.5 - 12.5
        } else if (tier < 0.70) {
          speedMult = Math.random() * 4.5 + 13.0; // Tầng 3: 13.0 - 17.5
        } else if (tier < 0.90) {
          speedMult = Math.random() * 4.5 + 18.0; // Tầng 4: 18.0 - 22.5
        } else {
          speedMult = Math.random() * 3.5 + 23.0; // Tầng 5: 23.0 - 26.5 (giảm nhẹ vừa vặn)
        }
        if (isBig) speedMult *= 1.18;

        const speed = speedMult * baseScale;
        this.vx = Math.cos(angle) * speed;
        this.vy = Math.sin(angle) * speed;

        this.friction = 0.958;
        // Độ rơi trọng lực liễu rủ tự nhiên sau khi bung nở
        this.gravity = 0.15;
        this.alpha = 1.0;
        this.decay = Math.random() * 0.009 + 0.008;
        this.color = color;
        this.radius = Math.random() * 0.6 + 1.4; // Hạt tròn 1.4 - 2.0px
      }

      update() {
        this.prevX = this.x;
        this.prevY = this.y;

        this.vx *= this.friction;
        this.vy *= this.friction;
        // Khi tia pháo giảm tốc ngang, gia tốc rơi tạo đường cong liễu rủ tuyệt đẹp
        this.vy += this.gravity;
        this.x += this.vx;
        this.y += this.vy;
        this.alpha -= this.decay;
      }

      draw(ctx) {
        if (this.alpha <= 0) return;
        const a = Math.max(0, this.alpha);

        // 1. Tia đuôi lửa thanh mảnh uốn lượn theo đường cong rơi
        ctx.globalAlpha = a * 0.78;
        ctx.strokeStyle = this.color;
        ctx.lineWidth = 1.6;
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(this.prevX, this.prevY);
        ctx.lineTo(this.x, this.y);
        ctx.stroke();

        // 2. Viền hạt pháo hoa bão hòa sắc nét
        ctx.globalAlpha = a;
        ctx.fillStyle = this.color;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.radius + 0.6, 0, Math.PI * 2);
        ctx.fill();

        // 3. Tâm nhụy hạt phát sáng trắng tinh khôi
        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.radius * 0.55, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    /**
     * ============================================================================
     * 6. CLASS PARTICLE (Bụi sao bung xòe, uốn rơi theo trọng lực rồi tụ thành chữ)
     * ============================================================================
     */
    class Particle {
      constructor(originX, originY, targetPoint, index) {
        this.x = originX;
        this.y = originY;
        this.tx = targetPoint.x;
        this.ty = targetPoint.y;
        this.lineType = targetPoint.lineType || 1;
        this.colorSeed = index;

        const angle = Math.random() * Math.PI * 2;
        const baseScale = Math.max(0.82, Math.min(width, height) / 660);
        // Tốc độ bung xòe stardust hài hòa, vừa vặn theo 5 tầng pháo
        const speed = (Math.random() * 10 + 5.5) * baseScale;
        this.vx = Math.cos(angle) * speed;
        this.vy = Math.sin(angle) * speed;

        this.friction = 0.952;
        // Trọng lực tạo độ rơi trĩu nhẹ cho bụi sao sau khi bung nở
        this.gravity = 0.14;

        this.phaseOffset = Math.random() * Math.PI * 2;
        this.springFactor = 0.065 + Math.random() * 0.022;
        this.alpha = 0.95;

        this.updateColorFromTheme();
      }

      updateColorFromTheme() {
        const theme = COLOR_THEMES[currentThemeIndex];
        const palette = this.lineType === 1 ? theme.line1 : theme.line2;
        this.color = palette[this.colorSeed % palette.length];
        this.coreSprite = getCoreSprite(this.color);
      }

      update(phase, elapsedSinceExplosion, timeSec) {
        if (phase === 'EXPLODING') {
          this.vx *= this.friction;
          this.vy *= this.friction;
          // Bụi sao bung xòe rồi cong trĩu rơi xuống một đoạn trước khi tụ lại
          this.vy += this.gravity;
          this.x += this.vx;
          this.y += this.vy;
        } else if (phase === 'MORPHING') {
          const dx = this.tx - this.x;
          const dy = this.ty - this.y;

          this.x += dx * this.springFactor;
          this.y += dy * this.springFactor;

          if (Math.abs(dx) < 1.5 && Math.abs(dy) < 1.5) {
            // Khi đã vào vị trí chữ: giữ nguyên tọa độ nét chữ sắc nét tuyệt đối, không rung nhòe
            this.x = this.tx;
            this.y = this.ty;
          }
        }
      }
    }

    /**
     * ============================================================================
     * 7. OFFSCREEN CANVAS TEXT SCANNER (Nét thư pháp thanh thoát, rõ ràng, chống nhòe)
     * ============================================================================
     */
    class TextPixelScanner {
      static formatProperName(rawName) {
        if (!rawName) return 'Em';
        const clean = rawName.trim().replace(/\s+/g, ' ');
        if (!clean) return 'Em';
        return clean
          .split(' ')
          .map((w) => (w ? w.charAt(0).toUpperCase() + w.slice(1).toLowerCase() : ''))
          .join(' ');
      }

      // Quét câu nói ở các hồi 1 - 4
      static sampleStageCoordinates(text, viewportWidth, viewportHeight, stageIndex) {
        const offCanvas = document.createElement('canvas');
        offCanvas.width = viewportWidth;
        offCanvas.height = viewportHeight;
        const octx = offCanvas.getContext('2d');

        const maxAllowedWidth = viewportWidth * 0.88;

        let fontSize = viewportWidth < 600
          ? Math.max(30, Math.min(Math.floor(viewportWidth * 0.092), 42))
          : Math.max(46, Math.min(Math.floor(viewportWidth * 0.065), 62));

        octx.font = `700 ${fontSize}px "Dancing Script", cursive, sans-serif`;

        let lines = [text];
        if (octx.measureText(text).width > maxAllowedWidth) {
          const words = text.split(' ');
          const mid = Math.ceil(words.length / 2);
          lines = [words.slice(0, mid).join(' '), words.slice(mid).join(' ')];
        }

        while (fontSize > 20) {
          octx.font = `700 ${fontSize}px "Dancing Script", cursive, sans-serif`;
          const allFit = lines.every((line) => octx.measureText(line).width <= maxAllowedWidth);
          if (allFit) break;
          fontSize -= 1;
        }

        octx.textAlign = 'center';
        octx.textBaseline = 'middle';
        octx.fillStyle = '#ffffff';
        octx.strokeStyle = '#ffffff';
        // Viền thanh mảnh vừa đủ (không làm bít các khe chữ như e, a, o)
        const strokeWidth = Math.max(1.2, fontSize * 0.024);
        octx.lineWidth = strokeWidth;
        octx.lineJoin = 'round';
        octx.lineCap = 'round';

        const centerX = viewportWidth / 2;
        const centerY = viewportHeight * 0.43;
        const lineHeight = fontSize * 1.36;
        const totalBlockHeight = (lines.length - 1) * lineHeight;
        const startY = centerY - totalBlockHeight / 2;

        lines.forEach((line, idx) => {
          const y = startY + idx * lineHeight;
          octx.strokeText(line, centerX, y);
          octx.fillText(line, centerX, y);
        });

        const minY = Math.max(0, Math.floor(startY - fontSize * 1.2));
        const maxY = Math.min(viewportHeight, Math.ceil(startY + lines.length * lineHeight + fontSize * 0.6));
        const minX = Math.max(0, Math.floor(centerX - maxAllowedWidth * 0.56));
        const maxX = Math.min(viewportWidth, Math.ceil(centerX + maxAllowedWidth * 0.56));

        const cropW = maxX - minX;
        const cropH = maxY - minY;
        if (cropW <= 0 || cropH <= 0) return [];

        const imgData = octx.getImageData(minX, minY, cropW, cropH).data;
        const step = 1.9; // Bước lấy mẫu chuẩn xác, hạt gối nhẹ nhàng, không bị dính cục
        const coords = [];

        for (let cy = 0; cy < cropH; cy += step) {
          const iy = Math.floor(cy);
          for (let cx = 0; cx < cropW; cx += step) {
            const ix = Math.floor(cx);
            const alphaIndex = (iy * cropW + ix) * 4 + 3;
            if (imgData[alphaIndex] > 70) {
              coords.push({
                x: minX + ix,
                y: minY + iy,
                lineType: stageIndex % 2 === 1 ? 1 : 2
              });
            }
          }
        }

        const maxParticles = viewportWidth < 600 ? 2200 : 3000;
        if (coords.length > maxParticles) {
          const ratio = coords.length / maxParticles;
          const sampled = [];
          for (let i = 0; i < maxParticles; i++) {
            sampled.push(coords[Math.floor(i * ratio)]);
          }
          return sampled;
        }

        return coords;
      }

      // Quét câu chốt hạ ở hồi 5 (Grand Finale)
      static computeBalancedLines(receiverName, maxAllowedWidth, octx, targetFontSize) {
        const formattedName = this.formatProperName(receiverName);
        const linePrefix = 'Làm người yêu anh nhé';
        const nameWords = formattedName.split(' ').filter(Boolean);

        const option2Lines = [linePrefix, `${formattedName}? ❤️`];

        octx.font = `700 ${targetFontSize}px "Dancing Script", cursive, sans-serif`;
        const w1 = octx.measureText(option2Lines[0]).width;
        const w2 = octx.measureText(option2Lines[1]).width;

        if (w1 <= maxAllowedWidth && w2 <= maxAllowedWidth) {
          return option2Lines;
        }

        if (nameWords.length >= 3) {
          const splitIdx = Math.ceil(nameWords.length / 2);
          const part1 = nameWords.slice(0, splitIdx).join(' ');
          const part2 = nameWords.slice(splitIdx).join(' ');
          return [linePrefix, part1, `${part2}? ❤️`];
        }

        if (nameWords.length === 2 && w2 > maxAllowedWidth) {
          return ['Làm người yêu anh', `nhé ${formattedName}? ❤️`];
        }

        if (w1 > maxAllowedWidth) {
          return ['Làm người yêu anh', `nhé ${formattedName}? ❤️`];
        }

        return option2Lines;
      }

      static sampleFinaleCoordinates(receiverName, viewportWidth, viewportHeight) {
        const offCanvas = document.createElement('canvas');
        offCanvas.width = viewportWidth;
        offCanvas.height = viewportHeight;
        const octx = offCanvas.getContext('2d');

        const maxAllowedWidth = viewportWidth * 0.88;

        let fontSize = viewportWidth < 600
          ? Math.max(34, Math.min(Math.floor(viewportWidth * 0.105), 48))
          : Math.max(50, Math.min(Math.floor(viewportWidth * 0.078), 72));

        let lines = this.computeBalancedLines(receiverName, maxAllowedWidth, octx, fontSize);
        const letterSpacing = Math.max(2.2, fontSize * 0.055);

        const measureWithSpacing = (str) => {
          let w = 0;
          for (let i = 0; i < str.length; i++) {
            w += octx.measureText(str[i]).width + (i < str.length - 1 ? letterSpacing : 0);
          }
          return w;
        };

        while (fontSize > 22) {
          octx.font = `700 ${fontSize}px "Dancing Script", cursive, sans-serif`;
          const allFit = lines.every((line) => measureWithSpacing(line) <= maxAllowedWidth);
          if (allFit) break;
          fontSize -= 1;
        }

        octx.textAlign = 'center';
        octx.textBaseline = 'middle';
        octx.fillStyle = '#ffffff';
        octx.strokeStyle = '#ffffff';
        // Nét viền thanh tú, giữ khoảng mở rõ ràng cho từng nét uốn
        const strokeWidth = Math.max(1.2, fontSize * 0.024);
        octx.lineWidth = strokeWidth;
        octx.lineJoin = 'round';
        octx.lineCap = 'round';

        const centerX = viewportWidth / 2;
        const centerY = viewportHeight * 0.43;
        const lineHeight = fontSize * 1.34;
        const totalBlockHeight = (lines.length - 1) * lineHeight;
        const startY = centerY - totalBlockHeight / 2;
        const lineSplitY = startY + lineHeight * 0.55;

        lines.forEach((line, idx) => {
          const y = startY + idx * lineHeight;
          const totalLineWidth = measureWithSpacing(line);
          let currentX = centerX - totalLineWidth / 2;

          for (let c = 0; c < line.length; c++) {
            const char = line[c];
            const charWidth = octx.measureText(char).width;
            const charCenterX = currentX + charWidth / 2;
            octx.strokeText(char, charCenterX, y);
            octx.fillText(char, charCenterX, y);
            currentX += charWidth + letterSpacing;
          }
        });

        const minY = Math.max(0, Math.floor(startY - fontSize * 1.2));
        const maxY = Math.min(viewportHeight, Math.ceil(startY + lines.length * lineHeight + fontSize * 0.6));
        const minX = Math.max(0, Math.floor(centerX - maxAllowedWidth * 0.56));
        const maxX = Math.min(viewportWidth, Math.ceil(centerX + maxAllowedWidth * 0.56));

        const cropW = maxX - minX;
        const cropH = maxY - minY;
        if (cropW <= 0 || cropH <= 0) return [];

        const imgData = octx.getImageData(minX, minY, cropW, cropH).data;
        const step = 1.9;
        const coords = [];

        for (let cy = 0; cy < cropH; cy += step) {
          const iy = Math.floor(cy);
          for (let cx = 0; cx < cropW; cx += step) {
            const ix = Math.floor(cx);
            const alphaIndex = (iy * cropW + ix) * 4 + 3;
            if (imgData[alphaIndex] > 70) {
              const realY = minY + iy;
              coords.push({
                x: minX + ix,
                y: realY,
                lineType: realY < lineSplitY ? 1 : 2
              });
            }
          }
        }

        const maxParticles = viewportWidth < 600 ? 2400 : 3400;
        if (coords.length > maxParticles) {
          const ratio = coords.length / maxParticles;
          const sampled = [];
          for (let i = 0; i < maxParticles; i++) {
            sampled.push(coords[Math.floor(i * ratio)]);
          }
          return sampled;
        }

        return coords;
      }
    }

    /**
     * ============================================================================
     * 8. ENGINE ĐIỀU PHỐI 5 HỒI PHÁO HOA TỎ TÌNH
     * ============================================================================
     */
    const canvas = document.getElementById('firework-canvas');
    const ctx = canvas.getContext('2d');
    const soundController = new SoundController(document.getElementById('bg-music'));

    let dpr = Math.min(window.devicePixelRatio || 1, 2);
    let width = window.innerWidth;
    let height = window.innerHeight;

    let currentPhase = 'IDLE'; // 'IDLE' | 'LAUNCHING' | 'EXPLODING' | 'MORPHING' | 'DISPERSING'
    let particles = [];
    let burstSparks = [];
    let ambientSparks = [];
    let explosionTimestamp = 0;
    let currentReceiverName = 'Trang';
    let dockShown = false;
    let toastTimer = null;

    function handleResize() {
      dpr = Math.min(window.devicePixelRatio || 1, 2);
      width = window.innerWidth;
      height = window.innerHeight;

      canvas.width = Math.round(width * dpr);
      canvas.height = Math.round(height * dpr);
      canvas.style.width = width + 'px';
      canvas.style.height = height + 'px';

      if (currentPhase === 'MORPHING' && particles.length > 0) {
        const cfg = STAGE_CONFIGS[currentStage - 1];
        const newTargets = cfg.isFinale
          ? TextPixelScanner.sampleFinaleCoordinates(currentReceiverName, width, height)
          : TextPixelScanner.sampleStageCoordinates(cfg.text, width, height, currentStage);

        if (newTargets.length > 0) {
          particles.forEach((p, idx) => {
            const target = newTargets[idx % newTargets.length];
            p.tx = target.x;
            p.ty = target.y;
            p.lineType = target.lineType || 1;
            p.updateColorFromTheme();
          });
        }
      }
    }
    handleResize();
    window.addEventListener('resize', handleResize);

    function showThemeToast(themeName) {
      const toast = document.getElementById('theme-toast');
      if (!toast) return;
      toast.textContent = `✨ Màu chữ: ${themeName}`;
      toast.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => {
        toast.classList.remove('show');
      }, 2000);
    }

    function spawnAmbientFirework() {
      const cx = width * (0.15 + Math.random() * 0.70);
      const cy = height * (0.15 + Math.random() * 0.65);
      const theme = COLOR_THEMES[currentThemeIndex];
      const color = theme.sparks[Math.floor(Math.random() * theme.sparks.length)];
      for (let i = 0; i < 24; i++) {
        burstSparks.push(new BurstSpark(cx, cy, color));
      }
      soundController.playExplosionBoom(false);
    }

    // Nổ riêng từng tên lửa khi bay tới đích (Đảm bảo 2 tên lửa nổ cả 2, 3 tên lửa nổ cả 3 - tầm nở cực đại)
    function triggerIndividualRocketBurst(originX, originY, isMain = true) {
      currentExplosionPoints.push({ x: originX, y: originY });
      soundController.playExplosionBoom(isMain);

      const theme = COLOR_THEMES[currentThemeIndex];
      const cfg = STAGE_CONFIGS[currentStage - 1];
      // Số lượng hạt dồi dào lấp đầy tầm nở to lớn
      const count = cfg.isFinale
        ? (isMain ? (width < 600 ? 150 : 210) : (width < 600 ? 100 : 140))
        : (width < 600 ? 110 : 160);

      for (let i = 0; i < count; i++) {
        const color = theme.sparks[i % theme.sparks.length];
        burstSparks.push(new BurstSpark(originX, originY, color, isMain));
      }
    }

    // Tạo các hạt chữ phân bổ từ tất cả các tâm nổ của loạt tên lửa
    function spawnStageTextParticles() {
      const cfg = STAGE_CONFIGS[currentStage - 1];
      if (cfg.isFinale) {
        soundController.startBackgroundMusicWithFadeIn();
      }

      const targetPoints = cfg.isFinale
        ? TextPixelScanner.sampleFinaleCoordinates(currentReceiverName, width, height)
        : TextPixelScanner.sampleStageCoordinates(cfg.text, width, height, currentStage);

      const numExplosions = currentExplosionPoints.length || 1;
      particles = targetPoints.map((pt, index) => {
        const origin = currentExplosionPoints.length > 0
          ? currentExplosionPoints[index % numExplosions]
          : { x: width / 2, y: height * 0.42 };
        return new Particle(origin.x, origin.y, pt, index);
      });
    }

    // Khởi tạo một Hồi trong chuỗi 5 Hồi
    function startStage(stageNumber) {
      if (stageNumber > 5) return;
      currentStage = stageNumber;
      currentExplosionPoints = [];
      const cfg = STAGE_CONFIGS[stageNumber - 1];

      // Cập nhật Badge hồi ở góc trên
      const badge = document.getElementById('stage-badge');
      if (badge) {
        badge.textContent = cfg.badge;
        badge.classList.remove('hidden');
      }

      // Nút bỏ qua đến câu chốt
      const skipBtn = document.getElementById('btn-skip-finale');
      if (skipBtn) {
        if (!cfg.isFinale) {
          skipBtn.classList.remove('hidden');
        } else {
          skipBtn.classList.add('hidden');
        }
      }

      const hint = document.getElementById('stage-hint');
      if (hint) {
        hint.classList.add('hidden');
      }

      // Khởi tạo tên lửa cho hồi này
      const rocketDefs = cfg.rockets(width, height);
      activeRockets = rocketDefs.map(
        (r) => new Firework(r.startX, r.startY, r.targetX, r.targetY, r.isMain)
      );

      currentPhase = 'LAUNCHING';
      particles = [];
      burstSparks = [];

      // Âm thanh rít pháo hoa
      soundController.playLaunchWhistle(cfg.isFinale ? 1.05 : 0.7);
    }

    // Chuyển nhanh sang hồi kế tiếp khi người dùng chạm màn hình
    function advanceStageEarly() {
      if (currentPhase !== 'MORPHING') return;
      if (currentStage >= 5) return;
      currentPhase = 'DISPERSING';
      disperseTimestamp = performance.now();
      const hint = document.getElementById('stage-hint');
      if (hint) hint.classList.add('hidden');
    }

    // Kích hoạt chuỗi 5 Hồi Pháo Hoa Tỏ Tình
    async function triggerConfessionFirework(receiverName) {
      currentReceiverName = TextPixelScanner.formatProperName(receiverName || 'Trang');
      nameInput.value = currentReceiverName;
      dockShown = false;
      document.getElementById('floating-dock').classList.remove('visible');

      if (document.fonts) {
        try {
          await document.fonts.load('700 48px "Dancing Script"');
          await document.fonts.ready;
        } catch (e) {
          console.warn('Font load error:', e);
        }
      }

      document.getElementById('input-screen').classList.add('fade-out');

      // Khởi động từ Hồi 1
      startStage(1);
    }

    // Vòng lặp Render 60fps
    function animate(now) {
      const timeSec = now * 0.001;

      // Scale context theo DPR
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

      // Lớp phủ mờ chuyển động: Giữ độ trong suốt cao để không để lại bóng ma nhòe nhoẹt
      ctx.globalCompositeOperation = 'source-over';
      const clearOpacity = currentPhase === 'MORPHING' ? 0.48 : (currentPhase === 'LAUNCHING' ? 0.38 : 0.44);
      ctx.fillStyle = `rgba(5, 2, 14, ${clearOpacity})`;
      ctx.fillRect(0, 0, width, height);

      // 1. Giai đoạn BẮN TÊN LỬA (LAUNCHING)
      if (currentPhase === 'LAUNCHING' && activeRockets.length > 0) {
        ctx.globalCompositeOperation = 'lighter';
        let allExploded = true;

        for (let i = 0; i < activeRockets.length; i++) {
          const r = activeRockets[i];
          if (!r.exploded) {
            r.update();
            r.draw(ctx);
            allExploded = false;
          } else {
            if (!r.burstCreated) {
              r.burstCreated = true;
              triggerIndividualRocketBurst(r.x, r.y, r.isMain);
            }
          }
        }

        // Vẽ các tia nổ của từng tên lửa đã phát nổ trong khi các tên lửa khác đang bay
        if (burstSparks.length > 0) {
          ctx.globalCompositeOperation = 'lighter';
          for (let i = burstSparks.length - 1; i >= 0; i--) {
            const b = burstSparks[i];
            b.update();
            b.draw(ctx);
            if (b.alpha <= 0) {
              burstSparks.splice(i, 1);
            }
          }
        }

        if (allExploded) {
          activeRockets = [];
          currentPhase = 'EXPLODING';
          explosionTimestamp = performance.now();
          spawnStageTextParticles();
        }
      }
      // 2. Giai đoạn PHÁT NỔ & TỤ CHỮ (EXPLODING | MORPHING)
      else if (currentPhase === 'EXPLODING' || currentPhase === 'MORPHING') {
        const elapsed = (now - explosionTimestamp) / 1000;
        const cfg = STAGE_CONFIGS[currentStage - 1];

        // Thời gian nổ bung và uốn rơi theo trọng lực trước khi chuyển sang tụ chữ
        if (currentPhase === 'EXPLODING' && elapsed >= 1.0) {
          currentPhase = 'MORPHING';
        }

        if (currentPhase === 'MORPHING') {
          if (cfg.isFinale) {
            // Hồi 5: Lời chốt hạ lưu vĩnh viễn trên màn hình
            if (elapsed >= 3.2 && !dockShown) {
              dockShown = true;
              document.getElementById('floating-dock').classList.add('visible');
            }
            if (elapsed > 2.8 && Math.random() < 0.016) {
              spawnAmbientFirework();
            }
          } else {
            // Hồi 1 - 4: Tăng thời gian chờ đọc chữ xong (hiện gợi ý chạm sau 3.2s)
            if (elapsed >= 3.2 && elapsed < cfg.duration) {
              const hint = document.getElementById('stage-hint');
              if (hint) hint.classList.remove('hidden');
            }
            if (elapsed >= cfg.duration) {
              advanceStageEarly();
            }
          }
        }

        // Vẽ các tia pháo hoa nổ bung xòe (Chế độ lighter với hạt sắc nét, thấy rõ từng tia)
        if (burstSparks.length > 0) {
          ctx.globalCompositeOperation = 'lighter';
          for (let i = burstSparks.length - 1; i >= 0; i--) {
            const b = burstSparks[i];
            b.update();
            b.draw(ctx);
            if (b.alpha <= 0) {
              burstSparks.splice(i, 1);
            }
          }
        }

        // Cập nhật tọa độ hạt morphing
        for (let i = 0; i < particles.length; i++) {
          particles[i].update(currentPhase, elapsed, timeSec);
        }

        // VẼ HẠT CHỮ: Sử dụng 'source-over' đơn tầng sắc nét, KHÔNG dùng lighter chồng lớp gây lóa nhòe
        ctx.globalCompositeOperation = 'source-over';
        for (let i = 0; i < particles.length; i++) {
          const p = particles[i];
          ctx.globalAlpha = p.alpha;
          ctx.drawImage(p.coreSprite, p.x - 4, p.y - 4);
        }
      }
      // 3. Giai đoạn TAN BIẾN CHUYỂN HỒI (DISPERSING)
      else if (currentPhase === 'DISPERSING') {
        let allFaded = true;
        for (let i = 0; i < particles.length; i++) {
          const p = particles[i];
          p.vx += (Math.random() - 0.5) * 0.4;
          p.vy -= 0.15 + Math.random() * 0.2; // bay bồng bềnh lên cao như tàn sao
          p.x += p.vx;
          p.y += p.vy;
          p.alpha -= 0.042;
          if (p.alpha > 0) allFaded = false;
        }

        ctx.globalCompositeOperation = 'source-over';
        for (let i = 0; i < particles.length; i++) {
          const p = particles[i];
          if (p.alpha > 0) {
            ctx.globalAlpha = Math.max(0, p.alpha);
            ctx.drawImage(p.coreSprite, p.x - 4, p.y - 4);
          }
        }

        if (allFaded || (now - disperseTimestamp) > 750) {
          startStage(currentStage + 1);
        }
      }

      ctx.globalAlpha = 1.0;
      ctx.globalCompositeOperation = 'source-over';

      requestAnimationFrame(animate);
    }
    requestAnimationFrame(animate);

    /**
     * ============================================================================
     * 9. SỰ KIỆN GIAO DIỆN & TÍCH HỢP VIETQR / CHẾ ĐỘ NGƯỜI NHẬN QUÀ
     * ============================================================================
     */
    const loveForm = document.getElementById('love-form');
    const nameInput = document.getElementById('target-name-input');

    // Chạm màn hình để chuyển nhanh hồi
    canvas.addEventListener('click', () => {
      advanceStageEarly();
    });

    // Bấm xem ngay câu chốt hạ
    document.getElementById('btn-skip-finale').addEventListener('click', () => {
      startStage(5);
    });

    // Chọn chủ đề màu từ Form ban đầu
    document.querySelectorAll('.theme-chip').forEach((chip) => {
      chip.addEventListener('click', (e) => {
        document.querySelectorAll('.theme-chip').forEach((c) => c.classList.remove('active'));
        e.currentTarget.classList.add('active');
        currentThemeIndex = parseInt(e.currentTarget.dataset.theme, 10) || 0;
      });
    });

    // Đổi màu trực tiếp ngay trên màn pháo hoa
    document.getElementById('btn-change-color').addEventListener('click', () => {
      currentThemeIndex = (currentThemeIndex + 1) % COLOR_THEMES.length;
      const theme = COLOR_THEMES[currentThemeIndex];
      for (let i = 0; i < particles.length; i++) {
        particles[i].updateColorFromTheme();
      }
      showThemeToast(theme.name);
      document.querySelectorAll('.theme-chip').forEach((chip) => {
        chip.classList.toggle('active', parseInt(chip.dataset.theme, 10) === currentThemeIndex);
      });
    });

    loveForm.addEventListener('submit', (e) => {
      e.preventDefault();
      const enteredName = nameInput.value.trim() || 'Trang';
      triggerConfessionFirework(enteredName);
    });

    // Bắn lại cả 5 hồi
    document.getElementById('btn-replay-show').addEventListener('click', () => {
      dockShown = false;
      document.getElementById('floating-dock').classList.remove('visible');
      startStage(1);
    });

    document.getElementById('btn-change-name').addEventListener('click', () => {
      currentPhase = 'IDLE';
      particles = [];
      ambientSparks = [];
      activeRockets = [];
      ctx.clearRect(0, 0, width, height);
      document.getElementById('stage-badge').classList.add('hidden');
      document.getElementById('btn-skip-finale').classList.add('hidden');
      document.getElementById('stage-hint').classList.add('hidden');
      document.getElementById('floating-dock').classList.remove('visible');
      document.getElementById('input-container').style.display = 'block';
      document.getElementById('input-screen').classList.remove('fade-out');
      nameInput.value = currentReceiverName;
      nameInput.focus();
    });

    document.getElementById('btn-mute').addEventListener('click', (e) => {
      const isMuted = soundController.toggleMute();
      e.currentTarget.textContent = isMuted ? '🔇 Đã tắt tiếng' : '🔊 Âm thanh';
    });

    // Tích hợp GiftSDK để người dùng tạo Link & Mã QR gửi tặng người thương
    window.addEventListener('DOMContentLoaded', async () => {
      const params = new URLSearchParams(window.location.search);
      const prefilledName = params.get('name');
      if (prefilledName) {
        nameInput.value = TextPixelScanner.formatProperName(prefilledName);
      }

      if (window.GiftSDK) {
        await window.GiftSDK.init({
          templateId: 'fireworks_confess',
          onGiftLoaded(order) {
            const receiver = TextPixelScanner.formatProperName(order.receiver_name || 'Em');
            currentReceiverName = receiver;
            nameInput.value = receiver;

            // Ẩn ô nhập tên khi Người Nhận mở link quà tặng
            document.getElementById('input-container').style.display = 'none';
            const themeWrap = document.querySelector('.theme-selector-wrap');
            if (themeWrap) themeWrap.style.display = 'none';

            document.getElementById('form-heading').textContent = `Món Quà Dành Tặng ${receiver}`;
            document.getElementById('form-subtext').textContent =
              'Ai đó đã gửi cho bạn một màn pháo hoa 5 hồi đặc biệt. Hãy chạm nút bên dưới để thắp sáng bầu trời đêm nhé!';
            document.getElementById('btn-trigger-firework').textContent = 'Chạm Để Ngắm 5 Hồi Pháo Hoa 🚀';
          }
        });

        const payBtn = document.getElementById('btn-create-gift-qr');
        if (payBtn) {
          payBtn.addEventListener('click', () => {
            window.GiftSDK.openPayment({
              templateId: 'fireworks_confess',
              senderName: 'Anh',
              receiverName: currentReceiverName,
              message: `Làm người yêu anh nhé ${currentReceiverName}?`
            });
          });
        }
      }
    });
  </script>
  <script src="../../../shared/tiktok-mode.js"></script>
</body>
</html>
