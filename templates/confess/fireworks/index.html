<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Pháo Hoa Chốt Hạ ✨ Gửi Lời Yêu Thương</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="../../../templates-catalog.js"></script>
  <script src="/shared/gift-sdk.js"></script>

  <style>
    :root {
      --neon-pink: #ff2a85;
      --neon-gold: #fde047;
      --neon-red: #ff1e56;
      --glass-bg: rgba(16, 8, 32, 0.72);
      --glass-border: rgba(255, 110, 180, 0.42);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: radial-gradient(ellipse at 50% 100%, #1c0836 0%, #090316 60%, #020108 100%);
      font-family: 'Plus Jakarta Sans', sans-serif;
      color: #ffffff;
      -webkit-font-smoothing: antialiased;
    }

    /* ==================== 1. BẦU TRỜI SAO LẤP LÁNH (CSS ANIMATION) ==================== */
    .night-sky-stars {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 1;
      background-image:
        radial-gradient(1.5px 1.5px at 12% 18%, #ffffff, transparent),
        radial-gradient(1.2px 1.2px at 28% 62%, #ffd1e8, transparent),
        radial-gradient(2px 2px at 46% 24%, #ffffff, transparent),
        radial-gradient(1.5px 1.5px at 68% 48%, #fde047, transparent),
        radial-gradient(1.2px 1.2px at 84% 16%, #ffffff, transparent),
        radial-gradient(2px 2px at 91% 72%, #ffb3d9, transparent),
        radial-gradient(1.5px 1.5px at 19% 84%, #ffffff, transparent),
        radial-gradient(1.2px 1.2px at 58% 82%, #ffd1e8, transparent),
        radial-gradient(1.8px 1.8px at 36% 38%, #ffffff, transparent),
        radial-gradient(1.4px 1.4px at 76% 88%, #fde047, transparent);
      background-size: 320px 320px;
      animation: twinkleSky 4s ease-in-out infinite alternate;
    }

    .night-sky-stars.layer-2 {
      background-size: 480px 480px;
      background-position: 140px 90px;
      animation-duration: 6.5s;
      opacity: 0.65;
    }

    @keyframes twinkleSky {
      0% { opacity: 0.35; transform: scale(0.99); }
      50% { opacity: 0.95; }
      100% { opacity: 0.45; transform: scale(1.01); }
    }

    /* ==================== 2. CANVAS HOẠT HỌA 2D ==================== */
    #firework-canvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 2;
      display: block;
    }

    /* ==================== 3. THANH CÔNG CỤ NHỎ TRÊN CÙNG ==================== */
    .top-bar {
      position: fixed;
      top: 16px;
      left: 16px;
      right: 16px;
      z-index: 20;
      display: flex;
      justify-content: space-between;
      align-items: center;
      pointer-events: none;
    }

    .top-bar > * {
      pointer-events: auto;
    }

    .top-pill-btn {
      height: 38px;
      padding: 0 14px;
      border-radius: 999px;
      background: rgba(16, 8, 32, 0.72);
      border: 1px solid rgba(255, 255, 255, 0.16);
      color: #f8fafc;
      font-family: inherit;
      font-size: 0.8rem;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      text-decoration: none;
      cursor: pointer;
      backdrop-filter: blur(10px);
      transition: all 0.2s ease;
    }

    .top-pill-btn:hover {
      border-color: var(--neon-pink);
      background: rgba(255, 42, 133, 0.22);
    }

    /* ==================== 4. MÀN HÌNH CHỜ GLASSMORPHISM FORM ==================== */
    .screen-overlay {
      position: fixed;
      inset: 0;
      z-index: 15;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      transition: opacity 0.85s cubic-bezier(0.22, 1, 0.36, 1),
                  transform 0.85s cubic-bezier(0.22, 1, 0.36, 1),
                  visibility 0.85s;
    }

    .screen-overlay.fade-out {
      opacity: 0;
      transform: scale(0.9) translateY(24px);
      visibility: hidden;
      pointer-events: none;
    }

    .glass-form-card {
      position: relative;
      width: 100%;
      max-width: 420px;
      padding: 36px 28px 32px;
      border-radius: 28px;
      background: var(--glass-bg);
      backdrop-filter: blur(22px);
      -webkit-backdrop-filter: blur(22px);
      border: 1px solid var(--glass-border);
      box-shadow:
        0 24px 60px rgba(0, 0, 0, 0.8),
        0 0 38px rgba(255, 42, 133, 0.25),
        inset 0 1px 1px rgba(255, 255, 255, 0.25);
      text-align: center;
    }

    .sparkle-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 5px 14px;
      border-radius: 999px;
      background: rgba(255, 42, 133, 0.16);
      border: 1px solid rgba(255, 110, 180, 0.45);
      color: #ff9ec6;
      font-size: 0.76rem;
      font-weight: 700;
      letter-spacing: 0.03em;
      margin-bottom: 14px;
    }

    .form-heading {
      font-family: 'Dancing Script', cursive;
      font-size: clamp(2.25rem, 6.5vw, 2.85rem);
      font-weight: 700;
      background: linear-gradient(135deg, #ffffff 0%, #ff9ec6 50%, #fde047 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      line-height: 1.2;
      margin-bottom: 10px;
    }

    .form-subtext {
      font-size: 0.88rem;
      color: #cbd5e1;
      line-height: 1.55;
      margin-bottom: 22px;
    }

    .input-wrap {
      margin-bottom: 18px;
      text-align: left;
    }

    .input-label {
      display: block;
      font-size: 0.8rem;
      font-weight: 600;
      color: #fbcfe8;
      margin-bottom: 7px;
      padding-left: 4px;
    }

    .glass-input {
      width: 100%;
      padding: 14px 18px;
      border-radius: 16px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      background: rgba(255, 255, 255, 0.07);
      color: #ffffff;
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 1rem;
      font-weight: 600;
      text-align: center;
      outline: none;
      transition: all 0.25s ease;
      user-select: text;
      -webkit-user-select: text;
    }

    .glass-input::placeholder {
      color: rgba(255, 255, 255, 0.4);
      font-weight: 400;
    }

    .glass-input:focus {
      border-color: var(--neon-pink);
      background: rgba(255, 42, 133, 0.1);
      box-shadow: 0 0 22px rgba(255, 42, 133, 0.4);
    }

    .btn-firework-launch {
      position: relative;
      width: 100%;
      padding: 16px 26px;
      border: none;
      border-radius: 999px;
      background: linear-gradient(135deg, #ff1e56 0%, #ff2a85 50%, #f59e0b 100%);
      background-size: 200% 200%;
      color: #ffffff;
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 1.05rem;
      font-weight: 800;
      letter-spacing: 0.02em;
      cursor: pointer;
      box-shadow:
        0 10px 28px rgba(255, 42, 133, 0.55),
        0 0 0 0 rgba(255, 42, 133, 0.6),
        inset 0 1px 2px rgba(255, 255, 255, 0.45);
      animation: pulseFireworkBtn 2s infinite ease-in-out, shimmerBg 4s ease infinite;
      transition: transform 0.22s ease, box-shadow 0.22s ease;
    }

    .btn-firework-launch:hover {
      transform: translateY(-2px) scale(1.03);
      box-shadow:
        0 14px 36px rgba(255, 42, 133, 0.8),
        0 0 24px rgba(253, 224, 71, 0.55);
    }

    .btn-firework-launch:active {
      transform: translateY(0) scale(0.98);
    }

    @keyframes pulseFireworkBtn {
      0%, 100% {
        box-shadow: 0 10px 28px rgba(255, 42, 133, 0.55), 0 0 0 0 rgba(255, 42, 133, 0.55);
      }
      50% {
        box-shadow: 0 12px 34px rgba(255, 42, 133, 0.8), 0 0 0 12px rgba(255, 42, 133, 0);
      }
    }

    @keyframes shimmerBg {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    /* ==================== 5. THANH ĐIỀU KHIỂN NỔI SAU KHI TỤ CHỮ ==================== */
    .floating-action-dock {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      z-index: 20;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
      width: 92%;
      max-width: 560px;
      opacity: 0;
      pointer-events: none;
      transition: all 0.55s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .floating-action-dock.visible {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
      pointer-events: auto;
    }

    .dock-btn {
      padding: 10px 18px;
      border-radius: 999px;
      background: rgba(16, 8, 32, 0.8);
      border: 1px solid rgba(255, 110, 180, 0.35);
      color: #fce7f3;
      font-family: inherit;
      font-size: 0.82rem;
      font-weight: 700;
      cursor: pointer;
      backdrop-filter: blur(12px);
      transition: all 0.2s ease;
      white-space: nowrap;
    }

    .dock-btn:hover {
      background: rgba(255, 42, 133, 0.3);
      border-color: var(--neon-pink);
      transform: translateY(-2px);
    }

    .dock-btn.cta-pay {
      background: linear-gradient(135deg, #ff2a85 0%, #9333ea 100%);
      border-color: rgba(255, 255, 255, 0.35);
      color: #ffffff;
      box-shadow: 0 6px 20px rgba(255, 42, 133, 0.45);
    }
  </style>
</head>
<body>

  <!-- 1. Bầu trời sao lấp lánh -->
  <div class="night-sky-stars"></div>
  <div class="night-sky-stars layer-2"></div>

  <!-- 2. Nhạc nền Pop/R&B ẩn (Fade-in sau tiếng nổ) -->
  <audio id="bg-music" preload="auto" loop crossorigin="anonymous">
    <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" type="audio/mpeg" />
  </audio>

  <!-- 3. Thanh công cụ phía trên -->
  <div class="top-bar">
    <a href="../../../index.html" class="top-pill-btn creator-only">⬅️ Kho Mẫu</a>
    <button type="button" id="btn-mute" class="top-pill-btn" title="Bật/Tắt Âm Thanh">🔊 Âm thanh</button>
  </div>

  <!-- 4. Canvas chính vẽ Pháo Hoa & Hạt Tụ Chữ -->
  <canvas id="firework-canvas"></canvas>

  <!-- 5. Màn hình chờ (Glassmorphism Form UI) -->
  <div id="input-screen" class="screen-overlay">
    <form id="love-form" class="glass-form-card" autocomplete="off">
      <div class="sparkle-badge">✨ Pháo Hoa Chốt Hạ 3D ✨</div>
      <h1 id="form-heading" class="form-heading">Gửi lời yêu thương</h1>
      <p id="form-subtext" class="form-subtext">
        Nhập tên người thương để bắn viên pháo hoa rực rỡ và thắp sáng lời tỏ tình giữa bầu trời đêm.
      </p>

      <div id="input-container" class="input-wrap">
        <label class="input-label" for="target-name-input">Tên người được tỏ tình</label>
        <input
          id="target-name-input"
          type="text"
          class="glass-input"
          placeholder="Ví dụ: Trang"
          maxlength="20"
          required
        />
      </div>

      <button type="submit" id="btn-trigger-firework" class="btn-firework-launch">
        Bắn Pháo Hoa 🚀
      </button>
    </form>
  </div>

  <!-- 6. Thanh nút nổi sau khi pháo hoa tụ chữ hoàn tất -->
  <div id="floating-dock" class="floating-action-dock">
    <button type="button" id="btn-replay-show" class="dock-btn">🎆 Bắn Lại</button>
    <button type="button" id="btn-change-name" class="dock-btn creator-only">✏️ Nhập Tên Khác</button>
    <button type="button" id="btn-create-gift-qr" class="dock-btn cta-pay creator-only">
      ✨ Tạo Link & QR Gửi Người Ấy
    </button>
  </div>

  <script>
    /**
     * ============================================================================
     * 1. SOUND SYNTHESIZER & AUDIO CONTROLLER (Web Audio API + Background MP3)
     * ============================================================================
     */
    class SoundController {
      constructor(audioElement) {
        this.ctx = null;
        this.bgAudio = audioElement;
        this.muted = false;
        this.fadeInterval = null;
      }

      initContext() {
        if (!this.ctx) {
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          if (AudioCtx) this.ctx = new AudioCtx();
        }
        if (this.ctx && this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
      }

      // Tiếng rít khi tên lửa bắn từ đáy màn hình lên trung tâm
      playLaunchWhistle(duration = 1.05) {
        if (this.muted) return;
        this.initContext();
        if (!this.ctx) return;

        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();

        osc.type = 'sine';
        osc.frequency.setValueAtTime(220, now);
        osc.frequency.exponentialRampToValueAtTime(920, now + duration);

        gain.gain.setValueAtTime(0.01, now);
        gain.gain.linearRampToValueAtTime(0.09, now + duration * 0.3);
        gain.gain.exponentialRampToValueAtTime(0.001, now + duration);

        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + duration);
      }

      // Tiếng nổ pháo hoa lớn bằng White Noise + Lowpass Filter + Sub Bass
      playExplosionBoom(isMain = true) {
        if (this.muted) return;
        this.initContext();
        if (!this.ctx) return;

        const now = this.ctx.currentTime;
        const duration = isMain ? 1.65 : 0.75;

        // 1. Sub-bass punch cho cú nổ uy lực
        if (isMain) {
          const subOsc = this.ctx.createOscillator();
          const subGain = this.ctx.createGain();
          subOsc.type = 'triangle';
          subOsc.frequency.setValueAtTime(130, now);
          subOsc.frequency.exponentialRampToValueAtTime(28, now + 0.55);

          subGain.gain.setValueAtTime(0.55, now);
          subGain.gain.exponentialRampToValueAtTime(0.001, now + 0.6);

          subOsc.connect(subGain);
          subGain.connect(this.ctx.destination);
          subOsc.start(now);
          subOsc.stop(now + 0.62);
        }

        // 2. White noise burst cho tiếng pháo nổ vang
        const bufferSize = Math.floor(this.ctx.sampleRate * duration);
        const noiseBuffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
        const output = noiseBuffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) {
          const decay = Math.exp(-i / (this.ctx.sampleRate * (isMain ? 0.36 : 0.16)));
          output[i] = (Math.random() * 2 - 1) * decay;
        }

        const whiteNoise = this.ctx.createBufferSource();
        whiteNoise.buffer = noiseBuffer;

        const filter = this.ctx.createBiquadFilter();
        filter.type = 'lowpass';
        filter.frequency.setValueAtTime(isMain ? 780 : 950, now);
        filter.frequency.exponentialRampToValueAtTime(95, now + duration);

        const noiseGain = this.ctx.createGain();
        noiseGain.gain.setValueAtTime(isMain ? 0.48 : 0.12, now);
        noiseGain.gain.exponentialRampToValueAtTime(0.001, now + duration);

        whiteNoise.connect(filter);
        filter.connect(noiseGain);
        noiseGain.connect(this.ctx.destination);
        whiteNoise.start(now);
      }

      // Kích hoạt nhạc nền và tăng dần âm lượng (Fade-in) sau tiếng nổ
      startBackgroundMusicWithFadeIn() {
        if (!this.bgAudio || this.muted) return;
        if (this.fadeInterval) clearInterval(this.fadeInterval);

        this.bgAudio.volume = 0.02;
        this.bgAudio.currentTime = 0;
        const playPromise = this.bgAudio.play();
        if (playPromise !== undefined) {
          playPromise.catch(() => {});
        }

        let vol = 0.02;
        const targetVolume = 0.75;
        this.fadeInterval = setInterval(() => {
          if (this.muted) {
            clearInterval(this.fadeInterval);
            return;
          }
          vol = Math.min(targetVolume, vol + 0.04);
          this.bgAudio.volume = vol;
          if (vol >= targetVolume) {
            clearInterval(this.fadeInterval);
          }
        }, 140);
      }

      toggleMute() {
        this.muted = !this.muted;
        if (this.bgAudio) {
          this.bgAudio.muted = this.muted;
        }
        return this.muted;
      }
    }

    /**
     * ============================================================================
     * 2. CLASS FIREWORK (Giai đoạn 1: Tên lửa lao vút lên với tốc độ cực nhanh)
     * ============================================================================
     */
    class Firework {
      constructor(startX, startY, targetX, targetY) {
        this.x = startX;
        this.y = startY;
        this.targetX = targetX;
        this.targetY = targetY;

        // Vận tốc bắn lên cực nhanh (tăng gấp 3 lần: vy từ -12.5 lên -32)
        this.vx = (targetX - startX) * 0.05;
        this.vy = -32;
        this.trail = [];
        this.exploded = false;
      }

      update() {
        this.trail.push({ x: this.x, y: this.y, alpha: 1 });
        if (this.trail.length > 25) {
          this.trail.shift();
        }
        this.trail.forEach((pt) => {
          pt.alpha *= 0.85;
        });

        // Lao vút lên mạnh mẽ và chỉ giảm tốc nhẹ khi rất sát điểm nổ
        const dy = this.targetY - this.y;
        this.vy += 0.85; // gia tốc hãm tự nhiên
        if (this.vy > -8) this.vy = -8; // đảm bảo vẫn lao nhanh vút lên

        this.x += (this.targetX - this.x) * 0.12;
        this.y += this.vy;

        if (this.y <= this.targetY || Math.abs(dy) <= 16) {
          this.y = this.targetY;
          this.exploded = true;
        }
      }

      draw(ctx) {
        ctx.save();
        // Vệt sáng tên lửa lao rực rỡ
        for (let i = 0; i < this.trail.length; i++) {
          const pt = this.trail[i];
          const ratio = (i + 1) / this.trail.length;
          ctx.beginPath();
          ctx.arc(pt.x + (Math.random() - 0.5) * 1.5, pt.y, ratio * 4.2, 0, Math.PI * 2);
          ctx.fillStyle = `rgba(253, 224, 71, ${pt.alpha * ratio * 0.9})`;
          ctx.fill();
        }

        // Đầu tên lửa sáng chói
        ctx.shadowBlur = 15;
        ctx.shadowColor = '#fde047';
        ctx.beginPath();
        ctx.arc(this.x, this.y, 4.5, 0, Math.PI * 2);
        ctx.fillStyle = '#ffffff';
        ctx.fill();
        ctx.restore();
      }
    }

    /**
     * ============================================================================
     * 3. CLASS BURST SPARK (Hạt pháo nổ bung xòe to hết cỡ 350+ hạt)
     * ============================================================================
     */
    class BurstSpark {
      constructor(originX, originY, color) {
        this.x = originX;
        this.y = originY;
        const angle = Math.random() * Math.PI * 2;
        // Lực nổ cực mạnh bung xòe rộng khắp màn hình
        const speed = Math.random() * 26 + 6;
        this.vx = Math.cos(angle) * speed;
        this.vy = Math.sin(angle) * speed;

        this.friction = 0.94; // ma sát tự nhiên
        this.gravity = 0.16;  // trọng lực tự nhiên rơi rụng sống động
        this.alpha = 1;
        this.decay = Math.random() * 0.018 + 0.012;
        this.color = color;
        this.radius = Math.random() * 1.6 + 1.0;
      }

      update() {
        this.vx *= this.friction;
        this.vy *= this.friction;
        this.vy += this.gravity;
        this.x += this.vx;
        this.y += this.vy;
        this.alpha -= this.decay;
      }

      draw(ctx) {
        if (this.alpha <= 0) return;
        ctx.save();
        ctx.globalAlpha = this.alpha;
        ctx.fillStyle = this.color;
        ctx.shadowBlur = 4;
        ctx.shadowColor = this.color;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }
    }

    /**
     * ============================================================================
     * 4. CLASS PARTICLE (Hạt morphing tạo chữ sắc sảo, thanh mảnh 1px, không cháy sáng)
     * ============================================================================
     */
    const ROMANTIC_PALETTE = [
      '#ff85b3', // Hồng phấn
      '#ff2a85', // Hồng Neon
      '#f472b6', // Hồng Pastel
      '#fde047', // Vàng Gold
      '#f59e0b', // Vàng Hổ Phách
      '#fb7185', // Đỏ Rose
      '#ff3b69'  // Đỏ San Hô
    ];

    class Particle {
      constructor(originX, originY, targetPoint, index) {
        this.x = originX;
        this.y = originY;

        // Tọa độ đích chữ
        this.tx = targetPoint.x;
        this.ty = targetPoint.y;

        // Vận tốc nổ ban đầu cực mạnh tỏa ra không gian rộng
        const angle = Math.random() * Math.PI * 2;
        const speed = Math.random() * 24 + 5;
        this.vx = Math.cos(angle) * speed;
        this.vy = Math.sin(angle) * speed;

        // Vật lý nổ sống động
        this.friction = 0.942;
        this.gravity = 0.14;

        // Độ dày của hạt đúng 1px sắc nét thanh mảnh
        this.baseRadius = 1.0;
        this.radius = 1.0;
        this.color = ROMANTIC_PALETTE[index % ROMANTIC_PALETTE.length];
        this.phaseOffset = Math.random() * Math.PI * 2;
        this.springFactor = 0.058 + Math.random() * 0.032;

        // Alpha vừa phải (0.65 - 0.85) để không bị cộng hưởng cháy trắng khi đứng cạnh nhau
        this.alpha = 0.72 + (index % 5) * 0.03;
      }

      update(phase, elapsedSinceExplosion, timeSec) {
        if (phase === 'EXPLODING') {
          // Bung xòe to khắp màn hình với ma sát và trọng lực rơi tự nhiên
          this.vx *= this.friction;
          this.vy *= this.friction;
          this.vy += this.gravity;
          this.x += this.vx;
          this.y += this.vy;
        } else if (phase === 'MORPHING') {
          // Bay về tạo nét chữ
          const dx = this.tx - this.x;
          const dy = this.ty - this.y;
          const dist = Math.hypot(dx, dy);

          this.x += dx * this.springFactor;
          this.y += dy * this.springFactor;

          // Khi đã về vị trí: chỉ dao động vi mô cực nhẹ (0.2px) để giữ nguyên phom chữ thanh mảnh
          if (dist < 2.5) {
            const jitterX = Math.sin(timeSec * 3.8 + this.phaseOffset) * 0.2;
            const jitterY = Math.cos(timeSec * 3.4 + this.phaseOffset) * 0.2;
            this.x = this.tx + jitterX;
            this.y = this.ty + jitterY;
          }
        }
      }

      draw(ctx) {
        ctx.globalAlpha = this.alpha;
        ctx.fillStyle = this.color;
        ctx.beginPath();
        ctx.arc(this.x, this.y, 1.0, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    /**
     * ============================================================================
     * 4. OFFSCREEN CANVAS TEXT SCANNER (Quét tọa độ pixel & Layout chữ Neon chống rớt chữ)
     * ============================================================================
     */
    class TextPixelScanner {
      // 1. Tự động viết hoa chữ cái đầu cho tên người nhận (Title Case chuẩn tiếng Việt)
      static formatProperName(rawName) {
        if (!rawName) return 'Em';
        const clean = rawName.trim().replace(/\s+/g, ' ');
        if (!clean) return 'Em';
        return clean
          .split(' ')
          .map((w) => (w ? w.charAt(0).toUpperCase() + w.slice(1).toLowerCase() : ''))
          .join(' ');
      }

      // 2. Thuật toán tính toán ngắt dòng (Line Breaking) thông minh:
      // Tuyệt đối không để rớt chữ hay rớt dấu hỏi "?", giữ câu từ cân đối, đẹp mắt
      static computeBalancedLines(receiverName, maxAllowedWidth, octx, targetFontSize) {
        const formattedName = this.formatProperName(receiverName);
        const linePrefix = 'Làm người yêu anh nhé';
        const nameWords = formattedName.split(' ').filter(Boolean);

        // Kịch bản A: 2 dòng chuẩn lãng mạn
        const option2Lines = [linePrefix, `${formattedName}? ❤️`];

        octx.font = `700 ${targetFontSize}px "Dancing Script", cursive, sans-serif`;
        const w1 = octx.measureText(option2Lines[0]).width;
        const w2 = octx.measureText(option2Lines[1]).width;

        // Nếu cả 2 dòng vừa vặn trong màn hình
        if (w1 <= maxAllowedWidth && w2 <= maxAllowedWidth) {
          return option2Lines;
        }

        // Nếu tên dài (>= 3 từ) khiến dòng 2 bị tràn -> Chia thành 3 dòng cân đối
        if (nameWords.length >= 3) {
          const splitIdx = Math.ceil(nameWords.length / 2);
          const part1 = nameWords.slice(0, splitIdx).join(' ');
          const part2 = nameWords.slice(splitIdx).join(' ');
          return [linePrefix, part1, `${part2}? ❤️`];
        }

        // Nếu tên 2 từ nhưng màn hình hẹp khiến dòng 2 bị tràn
        if (nameWords.length === 2 && w2 > maxAllowedWidth) {
          return ['Làm người yêu anh', `nhé ${formattedName}? ❤️`];
        }

        // Nếu dòng 1 bị tràn trên màn hình siêu nhỏ
        if (w1 > maxAllowedWidth) {
          return ['Làm người yêu anh', `nhé ${formattedName}? ❤️`];
        }

        return option2Lines;
      }

      // 3. Quét tọa độ pixel từ Offscreen Canvas: giãn cách chữ, nét sắc mảnh thanh tao
      static sampleTextCoordinates(receiverName, viewportWidth, viewportHeight) {
        const offCanvas = document.createElement('canvas');
        offCanvas.width = viewportWidth;
        offCanvas.height = viewportHeight;
        const octx = offCanvas.getContext('2d');

        const maxAllowedWidth = viewportWidth * 0.86;

        // Tính toán kích thước chữ tối ưu theo thiết bị
        let fontSize = viewportWidth < 600
          ? Math.max(32, Math.min(Math.floor(viewportWidth * 0.102), 46))
          : Math.min(Math.floor(viewportWidth * 0.08), 74);

        // Tính toán ngắt dòng hợp lý
        let lines = this.computeBalancedLines(receiverName, maxAllowedWidth, octx, fontSize);

        // Tăng khoảng cách giữa các chữ cái (letter-spacing) để các chữ không bị dính nét vào nhau
        const letterSpacing = Math.max(2.5, fontSize * 0.065);

        // Helper đo độ dài chuỗi có tính letterSpacing
        const measureWithSpacing = (str) => {
          let w = 0;
          for (let i = 0; i < str.length; i++) {
            w += octx.measureText(str[i]).width + (i < str.length - 1 ? letterSpacing : 0);
          }
          return w;
        };

        // Thu nhỏ nhẹ fontSize nếu dòng vẫn dài hơn màn hình điện thoại khi có letterSpacing
        while (fontSize > 20) {
          octx.font = `600 ${fontSize}px "Dancing Script", cursive, sans-serif`;
          const allFit = lines.every((line) => measureWithSpacing(line) <= maxAllowedWidth);
          if (allFit) break;
          fontSize -= 1;
        }

        octx.textAlign = 'center';
        octx.textBaseline = 'middle';
        octx.fillStyle = '#ffffff';

        // Căn giữa hoàn hảo cả trục X và trục Y
        const centerX = viewportWidth / 2;
        const centerY = viewportHeight * 0.43;
        const lineHeight = fontSize * 1.34;
        const totalBlockHeight = (lines.length - 1) * lineHeight;
        const startY = centerY - totalBlockHeight / 2;

        // Vẽ từng dòng chữ có giãn cách ký tự (letter-spacing)
        lines.forEach((line, idx) => {
          const y = startY + idx * lineHeight;
          const totalLineWidth = measureWithSpacing(line);
          let currentX = centerX - totalLineWidth / 2;

          for (let c = 0; c < line.length; c++) {
            const char = line[c];
            const charWidth = octx.measureText(char).width;
            octx.fillText(char, currentX + charWidth / 2, y);
            currentX += charWidth + letterSpacing;
          }
        });

        // Giới hạn vùng quét quanh khối chữ để tối ưu tốc độ xử lý tuyệt đối
        const minY = Math.max(0, Math.floor(startY - fontSize * 1.1));
        const maxY = Math.min(viewportHeight, Math.ceil(startY + lines.length * lineHeight + fontSize * 0.5));
        const minX = Math.max(0, Math.floor(centerX - maxAllowedWidth * 0.56));
        const maxX = Math.min(viewportWidth, Math.ceil(centerX + maxAllowedWidth * 0.56));

        const imageData = octx.getImageData(0, 0, viewportWidth, viewportHeight).data;
        // Bước nhảy 2px: Giữ mật độ vừa vặn, không bị đè hạt quá dày gây lóa
        const step = 2;
        const coords = [];

        for (let y = minY; y < maxY; y += step) {
          for (let x = minX; x < maxX; x += step) {
            const alphaIndex = (y * viewportWidth + x) * 4 + 3;
            // Ngưỡng alpha chuẩn để nét chữ thanh mảnh, rõ từng con chữ
            if (imageData[alphaIndex] > 95) {
              coords.push({ x, y });
            }
          }
        }

        // Tối ưu số lượng hạt khoảng 2.200 - 3.200 hạt: chữ sắc sảo, không bị chói lóa hay dính khối
        const maxParticles = viewportWidth < 600 ? 2500 : 3400;
        if (coords.length > maxParticles) {
          const ratio = coords.length / maxParticles;
          const sampled = [];
          for (let i = 0; i < maxParticles; i++) {
            sampled.push(coords[Math.floor(i * ratio)]);
          }
          return sampled;
        }

        return coords;
      }
    }

    /**
     * ============================================================================
     * 5. ENGINE CHÍNH ĐIỀU PHỐI 3 GIAI ĐOẠN PHÁO HOA TỎ TÌNH
     * ============================================================================
     */
    const canvas = document.getElementById('firework-canvas');
    const ctx = canvas.getContext('2d');
    const soundController = new SoundController(document.getElementById('bg-music'));

    let width = (canvas.width = window.innerWidth);
    let height = (canvas.height = window.innerHeight);

    let currentPhase = 'IDLE'; // 'IDLE' | 'LAUNCHING' | 'EXPLODING' | 'MORPHING'
    let mainFirework = null;
    let particles = [];
    let burstSparks = []; // Hạt pháo hoa bung xòe to khi nổ
    let ambientSparks = [];
    let explosionTimestamp = 0;
    let currentReceiverName = 'Trang';
    let dockShown = false;

    function handleResize() {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;

      // Nếu đang ở trạng thái tụ chữ mà xoay màn hình thì tính lại tọa độ đích
      if (currentPhase === 'MORPHING' && particles.length > 0) {
        const newTargets = TextPixelScanner.sampleTextCoordinates(currentReceiverName, width, height);
        if (newTargets.length > 0) {
          particles.forEach((p, idx) => {
            const target = newTargets[idx % newTargets.length];
            p.tx = target.x;
            p.ty = target.y;
          });
        }
      }
    }
    window.addEventListener('resize', handleResize);

    // Tạo pháo hoa phụ trang trí nền sau khi chữ đã hiện lên
    function spawnAmbientFirework() {
      const cx = width * (0.12 + Math.random() * 0.76);
      const cy = height * (0.12 + Math.random() * 0.72);
      const color = ROMANTIC_PALETTE[Math.floor(Math.random() * ROMANTIC_PALETTE.length)];
      for (let i = 0; i < 36; i++) {
        const angle = (Math.PI * 2 * i) / 36 + (Math.random() - 0.5) * 0.15;
        const speed = Math.random() * 3.2 + 0.8;
        ambientSparks.push({
          x: cx,
          y: cy,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed,
          alpha: 0.9,
          color
        });
      }
      soundController.playExplosionBoom(false);
    }

    // Kích hoạt chuỗi 3 giai đoạn Pháo Hoa Chốt Hạ
    async function triggerConfessionFirework(receiverName) {
      currentReceiverName = TextPixelScanner.formatProperName(receiverName || 'Trang');
      nameInput.value = currentReceiverName;
      dockShown = false;
      document.getElementById('floating-dock').classList.remove('visible');

      // Đảm bảo Google Font 'Dancing Script' đã tải xong trước khi quét pixel
      if (document.fonts && document.fonts.ready) {
        await document.fonts.ready;
      }

      // Ẩn màn hình Form với hiệu ứng Fade-out
      document.getElementById('input-screen').classList.add('fade-out');

      // Khởi tạo Giai đoạn 1: Bắn tên lửa từ đáy màn hình lên tâm
      const startX = width / 2;
      const startY = height + 10;
      const targetX = width / 2;
      const targetY = height * 0.44;

      particles = [];
      burstSparks = [];
      ambientSparks = [];
      mainFirework = new Firework(startX, startY, targetX, targetY);
      currentPhase = 'LAUNCHING';
      soundController.playLaunchWhistle(0.55);
    }

    // Chuyển từ Giai đoạn 1 (Bắn lên) sang Giai đoạn 2 (Phát nổ cực đại bung xòe to + morphing)
    function explodeIntoParticles(originX, originY) {
      currentPhase = 'EXPLODING';
      explosionTimestamp = performance.now();

      // Phát tiếng nổ Synthesizer cực uy lực & bắt đầu Fade-in nhạc nền
      soundController.playExplosionBoom(true);
      soundController.startBackgroundMusicWithFadeIn();

      // 1. Tạo 350 - 400 hạt pháo hoa nổ bung xòe to hết cỡ màn hình
      burstSparks = [];
      const burstCount = width < 600 ? 320 : 420;
      for (let i = 0; i < burstCount; i++) {
        const color = ROMANTIC_PALETTE[i % ROMANTIC_PALETTE.length];
        burstSparks.push(new BurstSpark(originX, originY, color));
      }

      // 2. Quét tọa độ chữ "Làm người yêu anh nhé [Tên]?" trên Offscreen Canvas
      const targetPoints = TextPixelScanner.sampleTextCoordinates(currentReceiverName, width, height);

      particles = targetPoints.map((pt, index) => new Particle(originX, originY, pt, index));
    }

    // Vòng lặp 60fps bằng requestAnimationFrame
    function animate(now) {
      const timeSec = now * 0.001;

      // Vẽ lớp phủ mờ để tạo vệt sáng chuyển động (Motion Trail)
      ctx.fillStyle = currentPhase === 'MORPHING'
        ? 'rgba(5, 2, 14, 0.34)'
        : 'rgba(5, 2, 14, 0.22)';
      ctx.fillRect(0, 0, width, height);

      if (currentPhase === 'LAUNCHING' && mainFirework) {
        mainFirework.update();
        mainFirework.draw(ctx);

        if (mainFirework.exploded) {
          explodeIntoParticles(mainFirework.x, mainFirework.y);
          mainFirework = null;
        }
      } else if (currentPhase === 'EXPLODING' || currentPhase === 'MORPHING') {
        const elapsed = (now - explosionTimestamp) / 1000;

        // Sau đúng 1.5 giây kể từ khi nổ -> Chuyển sang Giai đoạn 3 (Tụ chữ)
        if (currentPhase === 'EXPLODING' && elapsed >= 1.5) {
          currentPhase = 'MORPHING';
        }

        // Hiển thị thanh công cụ sau khi chữ đã tụ rõ ràng
        if (currentPhase === 'MORPHING' && elapsed >= 3.2 && !dockShown) {
          dockShown = true;
          document.getElementById('floating-dock').classList.add('visible');
        }

        // Bắn pháo hoa phụ nhẹ nhàng làm nền sau khi chữ đã hình thành
        if (currentPhase === 'MORPHING' && elapsed > 3.0 && Math.random() < 0.018) {
          spawnAmbientFirework();
        }

        // Vẽ các hạt pháo hoa nổ bung xòe cực đại
        if (burstSparks.length > 0) {
          ctx.save();
          ctx.globalCompositeOperation = 'lighter';
          for (let i = burstSparks.length - 1; i >= 0; i--) {
            const b = burstSparks[i];
            b.update();
            b.draw(ctx);
            if (b.alpha <= 0) {
              burstSparks.splice(i, 1);
            }
          }
          ctx.restore();
        }

        // Vẽ các hạt pháo hoa phụ làm nền
        for (let i = ambientSparks.length - 1; i >= 0; i--) {
          const sp = ambientSparks[i];
          sp.x += sp.vx;
          sp.y += sp.vy;
          sp.vy += 0.03;
          sp.alpha -= 0.016;
          if (sp.alpha <= 0) {
            ambientSparks.splice(i, 1);
            continue;
          }
          ctx.globalAlpha = sp.alpha;
          ctx.fillStyle = sp.color;
          ctx.beginPath();
          ctx.arc(sp.x, sp.y, 1.8, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.globalAlpha = 1;

        // Cập nhật & vẽ các hạt morphing chữ (ShadowBlur nhỏ 3.5, hạt 1px, nét thanh mảnh sắc sảo)
        ctx.save();
        ctx.globalCompositeOperation = 'lighter';
        ctx.shadowBlur = currentPhase === 'MORPHING' ? 3.5 : 2;
        ctx.shadowColor = '#ff2a85';
        for (let i = 0; i < particles.length; i++) {
          const p = particles[i];
          p.update(currentPhase, elapsed, timeSec);
          p.draw(ctx);
        }
        ctx.restore();
      }

      requestAnimationFrame(animate);
    }
    requestAnimationFrame(animate);

    /**
     * ============================================================================
     * 6. SỰ KIỆN GIAO DIỆN & TÍCH HỢP VIETQR / CHẾ ĐỘ NGƯỜI NHẬN QUÀ
     * ============================================================================
     */
    const loveForm = document.getElementById('love-form');
    const nameInput = document.getElementById('target-name-input');

    loveForm.addEventListener('submit', (e) => {
      e.preventDefault();
      const enteredName = nameInput.value.trim() || 'Trang';
      triggerConfessionFirework(enteredName);
    });

    document.getElementById('btn-replay-show').addEventListener('click', () => {
      triggerConfessionFirework(currentReceiverName);
    });

    document.getElementById('btn-change-name').addEventListener('click', () => {
      currentPhase = 'IDLE';
      particles = [];
      ambientSparks = [];
      ctx.clearRect(0, 0, width, height);
      document.getElementById('floating-dock').classList.remove('visible');
      document.getElementById('input-container').style.display = 'block';
      document.getElementById('input-screen').classList.remove('fade-out');
      nameInput.value = currentReceiverName;
      nameInput.focus();
    });

    document.getElementById('btn-mute').addEventListener('click', (e) => {
      const isMuted = soundController.toggleMute();
      e.currentTarget.textContent = isMuted ? '🔇 Đã tắt tiếng' : '🔊 Âm thanh';
    });

    // Tích hợp GiftSDK để người dùng tạo Link & Mã QR gửi tặng người thương
    window.addEventListener('DOMContentLoaded', async () => {
      const params = new URLSearchParams(window.location.search);
      const prefilledName = params.get('name');
      if (prefilledName) {
        nameInput.value = TextPixelScanner.formatProperName(prefilledName);
      }

      if (window.GiftSDK) {
        await window.GiftSDK.init({
          templateId: 'fireworks_confess',
          onGiftLoaded(order) {
            const receiver = TextPixelScanner.formatProperName(order.receiver_name || 'Em');
            currentReceiverName = receiver;
            nameInput.value = receiver;

            // Ẩn ô nhập tên khi Người Nhận mở link quà tặng, chỉ hiện nút Bắn Pháo Hoa mở quà
            document.getElementById('input-container').style.display = 'none';
            document.getElementById('form-heading').textContent = `Món Quà Dành Tặng ${receiver}`;
            document.getElementById('form-subtext').textContent =
              'Ai đó đã gửi cho bạn một bầu trời pháo hoa đặc biệt. Hãy chạm nút bên dưới để thắp sáng bầu trời đêm nhé!';
            document.getElementById('btn-trigger-firework').textContent = 'Chạm Để Ngắm Pháo Hoa 🚀';
          }
        });

        const payBtn = document.getElementById('btn-create-gift-qr');
        if (payBtn) {
          payBtn.addEventListener('click', () => {
            window.GiftSDK.openPayment({
              templateId: 'fireworks_confess',
              senderName: 'Anh',
              receiverName: currentReceiverName,
              message: `Làm người yêu anh nhé ${currentReceiverName}?`
            });
          });
        }
      }
    });
  </script>
